services:
  app:
    build: .
    image: trifecta-solar:latest
    container_name: trifecta-solar
    restart: unless-stopped
    ports:
      # Host port 8089 -> container port 80. Change the 8089 if it is taken. APP_BIND (in .env)
      # limits which host address listens: 127.0.0.1 when a reverse proxy on the same machine is the
      # only way in (a VPS: Docker's published ports bypass the host firewall); default all addresses.
      - "${APP_BIND:-0.0.0.0}:8089:80"
    environment:
      - TZ=America/New_York
    volumes:
      # Code (live: git pull on the host updates the app, no rebuild needed)
      - ./:/var/www/app
      # Live database in a Docker-managed volume, so the container's web user can always write
      # to it whatever the host folder's permissions are.
      - trifecta-data:/var/www/app/data
      # Backup snapshots land in ./backups in the repo folder (written as root by `bin/console backup`)
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  trifecta-data:
    name: trifecta-data
